server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers (§18); the API sets its own CORS policy (none — same origin only)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # API behind the same origin — long timeouts for report rendering and job submission
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /fonts/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # single-page app
    location / { try_files $uri $uri/ /index.html; }
}
