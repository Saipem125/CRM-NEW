[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waterflood-optimizer"
version = "0.5.0"
description = "CRM-based waterflood injection evaluation and optimization (architecture v2.1)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=15",
    "pywaterflood>=0.3",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "sqlalchemy>=2.0",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
reports = ["weasyprint>=60"]  # PDF without a browser; needs Pango/Cairo (GTK runtime on Windows)

[tool.setuptools.packages.find]
include = ["waterflood_app*"]

[tool.setuptools.package-data]
waterflood_app = ["**/*.yaml", "outputs/templates/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["waterflood_app/validation/external_fixtures/generate_fixtures.py", "waterflood_app/validation/external_fixtures/verify_fixtures.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "RUF"]
# RUF001-003: Greek letters, x-sign and arrows are the domain notation used in equations and section citations
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "N803", "N806", "N812"]  # N803/N806: J, F, A, X are the physics symbols of the Atlas

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["waterflood_app", "tests"]
exclude = "waterflood_app/validation/external_fixtures/(generate|verify)_fixtures[.]py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
